name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io)
# using GitHub Actions OIDC. Because the workflow runs in the dasasian/ repo, the
# registry grants the io.github.dasasian/* namespace from the token's repository_owner
# claim — no personal OAuth-app approval or org-membership visibility needed.
#
# Prerequisite: the referenced npm package version must already be published to npm
# (the registry verifies the package exists and that its package.json `mcpName`
# matches). Publish npm first, then run this.

on:
  workflow_dispatch: # lets you run it now from the Actions tab
  push:
    tags: ["v*"] # and automatically on future version tags

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC authentication
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # On a version tag, sync server.json to the tag (e.g. v0.1.2 -> 0.1.2) so the
      # registry entry matches the release. On manual runs, server.json is used as-is.
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
